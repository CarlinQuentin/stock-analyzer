<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    
    <!-- Line & Trend Gradient -->
    <linearGradient id="trendGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Area Gradient -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="63" height="63" x="0.5" y="0.5" rx="15.5" stroke="#334155" stroke-width="1" fill="none"/>

  <!-- Background Grid Lines -->
  <line x1="12" y1="22" x2="52" y2="22" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
  <line x1="12" y1="34" x2="52" y2="34" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
  <line x1="12" y1="46" x2="52" y2="46" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>

  <!-- Volume Histogram Bars -->
  <rect x="14" y="42" width="4" height="6" rx="1" fill="#3b82f6" opacity="0.4"/>
  <rect x="22" y="38" width="4" height="10" rx="1" fill="#3b82f6" opacity="0.4"/>
  <rect x="30" y="44" width="4" height="4" rx="1" fill="#3b82f6" opacity="0.4"/>
  <rect x="38" y="30" width="4" height="18" rx="1" fill="#10b981" opacity="0.5"/>
  <rect x="46" y="24" width="4" height="24" rx="1" fill="#10b981" opacity="0.6"/>

  <!-- Area Fill Under Line -->
  <path d="M 12 40 L 22 34 L 32 38 L 42 22 L 52 16 L 52 48 L 12 48 Z" fill="url(#areaGrad)"/>

  <!-- Trend Path Line -->
  <path d="M 12 40 L 22 34 L 32 38 L 42 22 L 52 16" fill="none" stroke="url(#trendGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Arrow Indicator at Peak -->
  <path d="M 44 16 L 52 16 L 52 24" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Active Point Dot -->
  <circle cx="52" cy="16" r="3" fill="#ffffff"/>
  <circle cx="52" cy="16" r="4.5" fill="none" stroke="#34d399" stroke-width="1.2"/>
</svg>